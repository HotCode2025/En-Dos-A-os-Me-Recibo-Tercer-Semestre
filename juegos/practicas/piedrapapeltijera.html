<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra, Papel y tijera</title>
</head>
<body>
    <script>
        // 1 Piedra, 2 Papel 
        let jugador = 0; 
        let max = 3; 
        let min = 1; 
        let pc = numAleatorio(max, min); 
        jugador = prompt("Elige : 1 piedra, 2 papel, 3 tijera");

        if(jugador == 1) {
            alert("Elegiste piedra");
        }else if (jugador == 2) {
            alert("Elegiste papel");
        }else if(jugador == 3){
            alert("Elegiste tijera");
        }else {
            alert("Elegiste perder");
        }

        //Combate
        if(pc == jugador) {
            alert("Empate");
        }else if(jugador == 1 && pc == 3) {
            alert("Ganaste");
        }else if (jugador == 2 && pc == 1) {
            alert("Ganaste"); 
        }else if(jugador == 3 && pc == 2) {
            alert("Ganaste");
        }else {
            alert("Perdiste");
        }

        //Nueva función para generar un número aleatorio entre 1 y 3
        // Math.random() arroja decimal 0 a 0.999
        // Multiplicar por (max-min+1) arroja rango de 0 a casi ese número
        // Math.floor() lo convierte en entero (0,1,2...)
        // Sumar min → desplaza al rango deseado (1,2,3)
        
        function numAleatorio(max, min) {
            return Math.floor(Math.random()*(max-min+1)+min);
        }
    </script>
</body>
</html>
